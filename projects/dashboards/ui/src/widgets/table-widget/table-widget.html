@if (table(); as t) {
  <table class="dash-table">
    <thead>
      <tr>
        @for (column of t.columns; track $index) {
          <th scope="col" [class.is-number]="t.numeric[$index]">{{ column }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of t.rows; track $index) {
        <tr>
          @for (cell of row; track $index) {
            @if (isNumber(cell)) {
              <td class="is-number">{{ i18n.number(cell) }}</td>
            } @else {
              <td class="is-text" [title]="cell ?? ''"><bdi>{{ cell ?? '—' }}</bdi></td>
            }
          }
        </tr>
      }
    </tbody>
  </table>
}
