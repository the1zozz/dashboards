@let t = text();
<header class="demo-header">
  <div class="demo-heading">
    <h1>{{ t.title }} <span class="demo-badge">{{ t.example }}</span></h1>
    <p>{{ t.subtitle }}</p>
  </div>
  <div class="demo-controls">
    <button type="button" class="demo-button" [attr.aria-label]="t.languageLabel" (click)="toggleLanguage()">{{ t.language }}</button>
    <button type="button" class="demo-button" [attr.aria-label]="t.themeLabel" (click)="toggleTheme()">
      {{ settings.theme() === 'light' ? t.dark : t.light }}
    </button>
  </div>
</header>
<main class="demo-main">
  <!-- The board and its charts load in their own chunk, as on a lazy dashboards route in a real project. -->
  @defer (on immediate) {
    @if (opened(); as o) {
      <a class="demo-back" href="#" (click)="$event.preventDefault(); show(null)">{{ t.back }}</a>
      <!-- A new board for each dashboard: tracked by id, so going from one to a copy starts afresh. -->
      @for (b of [o]; track b.id) {
        <dash-board [id]="b.id" [startEditing]="b.edit" (removed)="show(null)" (copied)="openCopy($event)" />
      }
    } @else {
      <dash-dashboard-list [link]="link" (open)="show($event)" />
    }
  } @placeholder {
    <p class="demo-loading">…</p>
  }
</main>
